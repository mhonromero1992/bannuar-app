apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. By default is just 'debug'.
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "prodDebug"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * R8 shrinking for release builds. Off until a release build has been tried on a phone with it on:
 * every library here ships its own keep rules, but nobody has run this app minified yet.
 * Turn on with -PbannuarMinify=true (README: Smaller APK).
 */
def enableProguardInReleaseBuilds = (findProperty('bannuarMinify') ?: 'false').toBoolean()

/**
 * The preferred build flavor of JavaScriptCore (JSC). Hermes is on (gradle.properties), so this is
 * used only if hermesEnabled is switched off.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * Google Play takes only builds signed with Bannuar's upload key. The key never goes in git (.gitignore
 * drops *.keystore and *.jks): its path and passwords go in ~/.gradle/gradle.properties on the machine
 * that builds releases, or in ORG_GRADLE_PROJECT_<name> environment variables on a build server.
 * Without them, release builds are signed with the debug key so they still install on a test phone,
 * and bundleRelease (the file uploaded to Play) stops with an error. README: Release builds.
 */
def uploadStoreFile = findProperty('BANNUAR_UPLOAD_STORE_FILE')
def uploadStorePassword = findProperty('BANNUAR_UPLOAD_STORE_PASSWORD')
def uploadKeyAlias = findProperty('BANNUAR_UPLOAD_KEY_ALIAS')
def uploadKeyPassword = findProperty('BANNUAR_UPLOAD_KEY_PASSWORD')
def hasUploadKey = [uploadStoreFile, uploadStorePassword, uploadKeyAlias, uploadKeyPassword].every { it }

gradle.taskGraph.whenReady { graph ->
    if (!hasUploadKey && graph.allTasks.any { it.name == 'bundleRelease' }) {
        throw new GradleException(
            'bundleRelease needs the Play upload key: set BANNUAR_UPLOAD_STORE_FILE, BANNUAR_UPLOAD_STORE_PASSWORD, ' +
            'BANNUAR_UPLOAD_KEY_ALIAS and BANNUAR_UPLOAD_KEY_PASSWORD in ~/.gradle/gradle.properties (README: Release builds).')
    }
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "ph.bannuar.employee"
    defaultConfig {
        applicationId "ph.bannuar.employee"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // Raise versionCode by one for every upload to Google Play.
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasUploadKey) {
            release {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    // One APK per processor type for phones installed by hand (about half the size of one APK for
    // all). Google Play builds its own split from the .aab, so this only affects assembleRelease.
    splits {
        abi {
            enable gradle.startParameter.taskNames.any { it.contains('Release') && it.contains('assemble') }
            reset()
            include 'armeabi-v7a', 'arm64-v8a'
            universalApk true
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // The upload key when it is set up (see above), otherwise the debug key for test phones.
            signingConfig hasUploadKey ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Push stays off until Bannuar's Firebase project file is here (README: Push notifications). Without
// it the build still works: the Google Services plugin is not applied and the app never asks Firebase.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}
